articles:
  - title: "Atidarytas naujas pasaulis – Už Sienos!"
    date: "2026-10-12 12:00"
    author: "NightWatch"
    link: ""
    content: |
      <h3>Už Sienos laukia nauji nuotykiai</h3>
      <p>Siena atsivėrė! Nuo šiandien kiekvienas NightWatch žaidėjas gali keliauti į naują pasaulį – <b>Už Sienos</b>.</p>
      <p>Už ledinių sienų tavęs laukia:</p>
      <ul>
        <li>naujos, dar niekieno neištyrinėtos žemės,</li>
        <li>pavojingesni priešai ir vertingesnis grobis,</li>
        <li>nauji užduočių ir nuotykių siužetai, kurie atsirakina keliaujant vis toliau.</li>
      </ul>
      <p>Pasiruošk gerai – šaltis ir tamsa ten negailestingi. Imk šiltus drabužius, maisto ir draugų.</p>
      <p><i>Naktis renkasi, o mano sargyba prasideda.</i></p>
